<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de Exercícios JavaScript</title>
</head>

<body>

    <h1>Lista de Exercícios</h1>

    <select id="exercicio">
        <option value="3">Exercício 3 - Produtos vencidos</option>
        <option value="4">Exercício 4 - População Nigéria e China</option>
        <option value="5">Exercício 5 - Corrida entre carros</option>
        <option value="6">Exercício 6 - Lotação do bar</option>
        <option value="7">Exercício 7 - Pés para metros</option>
        <option value="8">Exercício 8 - Venda do violão</option>
        <option value="9">Exercício 9 - Pontos de Gabriel</option>
        <option value="10">Exercício 10 - Swap</option>
        <option value="11">Exercício 11 - Quadrado</option>
        <option value="12">Exercício 12 - Números de 0 a 1000</option>
        <option value="13">Exercício 13 - Potência</option>
        <option value="14">Exercício 14 - Ímpares decrescentes</option>
        <option value="15">Exercício 15 - Cofrinho</option>
        <option value="16">Exercício 16 - Caixa d'água</option>
        <option value="17">Exercício 17 - Robô na escada</option>
        <option value="18">Exercício 18 - Contador com Pulo</option>
        <option value="19">Exercício 19 - Escada de Eco</option>
    </select>

    <button onclick="executar()">Executar</button>

    <pre id="resultado"></pre>


    <script>

        function executar() {

            let exercicio = document.getElementById("exercicio").value;
            let resultado = document.getElementById("resultado");

            resultado.innerHTML = "";


            // EXERCÍCIO 3
            if (exercicio == "3") {

                while (true) {

                    let produto = prompt("Digite o nome do produto ou 'sair' para encerrar:");

                    if (produto.toLowerCase() == "sair") {
                        break;
                    }

                    let validade = prompt("Digite a data de vencimento (AAAA-MM-DD):");

                    let dataValidade = new Date(validade);
                    let hoje = new Date();

                    if (dataValidade < hoje) {
                        resultado.innerHTML += produto + " está vencido.\n";
                    } else {
                        resultado.innerHTML += produto + " não está vencido.\n";
                    }
                }
            }


            // EXERCÍCIO 4
            if (exercicio == "4") {

                let nigeria = 195900000;
                let china = 1393000000;
                let anos = 0;

                while (nigeria <= china) {

                    nigeria = nigeria * 1.038;
                    china = china * 1.0037;

                    anos++;

                    resultado.innerHTML +=
                        "Ano " + anos +
                        " - Nigéria: " + Math.round(nigeria) +
                        " | China: " + Math.round(china) + "\n";
                }

                resultado.innerHTML +=
                    "\nA Nigéria ultrapassará a China em " +
                    anos + " anos.";
            }


            // EXERCÍCIO 5
            if (exercicio == "5") {

                let carro1 = 10;
                let carro2 = 20;
                let volta = 0;

                while (carro1 <= carro2) {

                    volta++;

                    carro1 += 3;
                    carro2 += 1.5;

                    resultado.innerHTML +=
                        "Volta " + volta +
                        " - Carro 1: " + carro1 +
                        " km/h | Carro 2: " + carro2 +
                        " km/h\n";
                }

                resultado.innerHTML +=
                    "\nTotal de voltas: " + volta;
            }


            // EXERCÍCIO 6
            if (exercicio == "6") {

                let baseMaior = 120;
                let baseMenor = 75;
                let altura = 145;

                let areaTrapezio =
                    ((baseMaior + baseMenor) / 2) * altura;

                let areaPalco = 15 * 8.5;

                let areaPublico = areaTrapezio - areaPalco;

                let ingressos = areaPublico * 4;

                resultado.innerHTML =
                    "Área do trapézio: " + areaTrapezio + " m²\n" +
                    "Área do palco: " + areaPalco + " m²\n" +
                    "Área disponível para o público: " + areaPublico + " m²\n" +
                    "Quantidade de ingressos: " + Math.floor(ingressos);
            }


            // EXERCÍCIO 7
            if (exercicio == "7") {

                let pes = Number(prompt("Digite a altura em pés:"));

                let metros = pes * 0.3048;

                resultado.innerHTML =
                    pes + " pés = " + metros.toFixed(2) + " metros.";
            }


            // EXERCÍCIO 8
            if (exercicio == "8") {

                let valor = 360;

                let valorOriginal = valor / 0.80;

                let valorComLucro = valorOriginal * 1.20;

                resultado.innerHTML =
                    "Valor original: R$ " + valorOriginal.toFixed(2) +
                    "\nValor para ter 20% de lucro: R$ " +
                    valorComLucro.toFixed(2);
            }


            // EXERCÍCIO 9
            if (exercicio == "9") {

                let mariana = 18;
                let sabrina = 22;

                let gabriel =
                    (mariana + sabrina) / 4 + 17;

                resultado.innerHTML =
                    "Gabriel tem " + gabriel + " pontos.";
            }


            // EXERCÍCIO 10
            if (exercicio == "10") {

                let primeiroNome = "will";
                let segundoNome = "lucas";

                for (let i = 1; i <= 10; i++) {

                    let temp = primeiroNome;

                    primeiroNome = segundoNome;
                    segundoNome = temp;

                    resultado.innerHTML +=
                        "Interação " + i +
                        ": primeiroNome = " + primeiroNome +
                        " | segundoNome = " + segundoNome + "\n";
                }
            }


            // EXERCÍCIO 11
            if (exercicio == "11") {

                let largura = Number(prompt("Digite a largura:"));
                let altura = Number(prompt("Digite a altura:"));

                for (let i = 0; i < altura; i++) {

                    for (let j = 0; j < largura; j++) {
                        resultado.innerHTML += "* ";
                    }

                    resultado.innerHTML += "\n";
                }
            }


            // EXERCÍCIO 12
            if (exercicio == "12") {

                for (let i = 0; i <= 1000; i += 10) {
                    resultado.innerHTML += i + "\n";
                }
            }


            // EXERCÍCIO 13
            if (exercicio == "13") {

                let numero = Number(prompt("Digite o número:"));
                let expoente = Number(prompt("Digite o expoente:"));

                let resultadoPotencia = 1;

                for (let i = 1; i <= expoente; i++) {

                    resultadoPotencia *= numero;

                    resultado.innerHTML +=
                        numero + " elevado a " + i +
                        " = " + resultadoPotencia + "\n";
                }
            }


            // EXERCÍCIO 14
            if (exercicio == "14") {

                for (let i = 99; i >= 1; i -= 2) {
                    resultado.innerHTML += i + "\n";
                }
            }


            // EXERCÍCIO 15
            if (exercicio == "15") {

                let total = 0;

                for (let dia = 1; dia <= 12; dia++) {

                    let deposito = dia * 2;

                    total += deposito;

                    resultado.innerHTML +=
                        "Dia " + dia +
                        ": R$ " + deposito.toFixed(2) +
                        " | Total: R$ " + total.toFixed(2) + "\n";
                }

                resultado.innerHTML +=
                    "\nTotal após 12 dias: R$ " +
                    total.toFixed(2);
            }


            // EXERCÍCIO 16
            if (exercicio == "16") {

                let agua = 150;
                let hora = 0;

                while (agua >= 7) {

                    agua -= 7;
                    hora++;

                    resultado.innerHTML +=
                        "Hora " + hora +
                        ": " + agua + " litros\n";
                }

                resultado.innerHTML +=
                    "\nÁgua restante: " + agua + " litros.";
            }


            // EXERCÍCIO 17
            if (exercicio == "17") {

                let tempo = 0;

                for (let degrau = 1; degrau <= 20; degrau++) {

                    tempo += 3;

                    resultado.innerHTML +=
                        "Degrau " + degrau +
                        ": " + tempo + " segundos\n";
                }
            }


            // EXERCÍCIO 18
            if (exercicio == "18") {

                for (let i = 1; i <= 25; i++) {

                    if (i % 3 == 0) {
                        resultado.innerHTML += "Pulo\n";
                    } else {
                        resultado.innerHTML += i + "\n";
                    }
                }
            }


            // EXERCÍCIO 19
            if (exercicio == "19") {

                let vezes = Number(prompt("Quantas vezes o eco acontece?"));

                for (let i = 1; i <= vezes; i++) {

                    for (let j = 1; j <= i; j++) {

                        resultado.innerHTML += "Olá ";

                    }

                    resultado.innerHTML += "\n";
                }
            }

        }

    </script>

</body>
</html>
